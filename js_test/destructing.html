<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>destructuring</title>
</head>
<body>
    <h4>destructuring in js</h4>
    <script>
        let numbers = [10,20,30,40,50,60,70]
        // let firstNumber = numbers[0];
        // let secondNumber = numbers[1];
        let [firstNumber,,thirdNumber,...others] = numbers;
        console.log(firstNumber,thirdNumber,others);
        let numbers2 = [1,2];
        // thirdNumber = numbers2[2] !== undefined ? numbers2[2] : 0;
        [,,thirdNumber=0] = numbers2;
        console.log(thirdNumber);

        let a = 10;
        let b = 20;
        console.log(a,b);
        [a , b] = [b,a];
        console.log(a,b);

        let person = {
            "firstName": "John",
            "lastName": "Doe",
        }
        let {
            firstName : fname,
            lastName : lname
        } = person;
        console.log(fname,lname);
        let {
            firstname ,
            lastname
        } = person;
        console.log(firstname,lastname);

    </script>
</body>
</html>
