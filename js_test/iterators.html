<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iterators and generators</title>
</head>
<body>
  <h4>iterators and generators</h4>
<script>
  console.log("iterators and generators");

  function buildSqauredNumbersIterator(from = 1, to = 10) {
    // console.log(`from ${from} to ${to}`);
    let count = from - 1;
    // console.log(`count ${count} of ${to}`);
    return {
      next: ()=> {
        if (count >= to) return {done:true};
        count++;
        return {value: count * count, done: false};
      },
      hasNext: ()=> {
        return count < to;
      },
        [Symbol.iterator] : function() {return this}
    };
  }

  function* ownGenerators() {
      console.log("first line : ");
      yield 1;
      console.log("second line : ");
      yield 2;
  }
  let ownGen = ownGenerators();
  console.log("our result is ", ownGen);
  console.log(ownGen.next())
  console.log(ownGen.next())
  console.log(ownGen.next())

</script>
</body>
</html>
