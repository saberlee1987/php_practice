    <h4>arrow function in Es6</h4>
    <script>
        function sum(num1, num2) {
            return num1 + num2;
        }
        let subtract = (num1, num2) => num1 - num2;

        console.log(sum(5,4));
        console.log(subtract(18,11));

                // setTimeout(function () {

                // },1000)

                }, 1000);
            }
        }
