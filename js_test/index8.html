<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>sync and async example</title>
</head>
<body>
    <h4>sync and async example</h4>

    <script>
        async function hello() {
            setTimeout(function () {
                console.log("Hello World @@@");
            }, 5000);
            console.log("after the timeout ")
        }
        console.log("hello")
        hello();
    </script>
</body>
</html>
